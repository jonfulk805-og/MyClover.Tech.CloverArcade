server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer / threaded cores need cross-origin isolation
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # large ROM/ISO files
    client_max_body_size 8192m;
    sendfile on;

    # NOTE: do NOT add a `types { ... }` block here -- at server level it
    # REPLACES the mime.types map included by the main nginx.conf, so .html is
    # served as application/octet-stream and browsers download the page instead
    # of rendering it. The base image's mime.types already maps .wasm.
    default_type application/octet-stream;

    location /roms/ {
        alias /roms/;
        autoindex off;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Accept-Ranges bytes;
    }

    # upload / manage API -> local Python service. Streaming, never buffered.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        client_max_body_size 8192m;
        add_header Cache-Control "no-store" always;
    }

    location = /games.json {
        add_header Cache-Control "no-store" always;
    }

    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
