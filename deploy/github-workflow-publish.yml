# ---------------------------------------------------------------------------
# INSTALL: copy this file to  .github/workflows/publish.yml  and commit it.
# It lives here because a GitHub App cannot push workflow files without the
# 'workflows' permission -- so Viktor left it one move away.
#   mkdir -p .github/workflows
#   git mv deploy/github-workflow-publish.yml .github/workflows/publish.yml
#   git commit -m 'add GHCR publish workflow' && git push
# Then push a tag (or run it from the Actions tab) to publish the images.
# ---------------------------------------------------------------------------
# Builds both CloverArcade images on GitHub's runners and publishes them to
# GitHub Container Registry, so any Docker host can just pull them.
#
# Triggers on a version tag (v0.3.1, v0.4.0, ...) and on manual dispatch.
# Needs no secrets: GITHUB_TOKEN is granted package write below.
#
# After the first successful run, make the packages public once at
#   github.com/jonfulk805-og?tab=packages -> package -> Package settings
# and then anyone can:
#   docker pull ghcr.io/jonfulk805-og/cloverarcade:latest

name: publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloverarcade
            context: .
          - name: cloverarcade-mame
            context: ./mame
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
