<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beard Lizard</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #140e09;
    color: #f4f4f2;
    overflow: hidden;
  }
  body {
    display: grid;
    place-items: center;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }
  canvas {
    touch-action: none;
    background: #140e09;
    max-width: 100%;
    max-height: 100%;
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  #touch {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  #stick {
    display: none;
    pointer-events: auto;
    position: absolute;
    left: max(18px, env(safe-area-inset-left));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 116px;
    height: 116px;
    border-radius: 50%;
    background: rgba(255, 244, 220, 0.08);
    border: 2px solid rgba(255, 244, 220, 0.28);
    touch-action: none;
  }
  #nub {
    width: 48px;
    height: 48px;
    margin: -24px 0 0 -24px;
    border-radius: 50%;
    background: rgba(232, 191, 74, 0.92);
    position: absolute;
    left: 50%;
    top: 50%;
  }
  #flare {
    pointer-events: auto;
    position: absolute;
    right: max(22px, env(safe-area-inset-right));
    bottom: max(28px, env(safe-area-inset-bottom));
    width: 86px;
    height: 86px;
    border-radius: 50%;
    border: 0;
    background: #e23b2f;
    color: #fff8ef;
    font: 800 13px/1.1 "Trebuchet MS", "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    touch-action: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  @media (pointer: coarse), (max-width: 820px) {
    #stick { display: block; }
  }
</style>
</head>
<body>
<p class="sr">Beard Lizard. Move with the arrow keys or WASD and eat every bug to clear the level. Avoid snakes, cats, hawks, and goannas. Space flares your beard and scares nearby predators.</p>
<canvas id="c" width="576" height="376"></canvas>
<div id="touch">
  <div id="stick" aria-hidden="true"><div id="nub"></div></div>
  <button id="flare" type="button">BEARD</button>
</div>
<script src="game.js"></script>
</body>
</html>
