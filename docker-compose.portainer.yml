# CloverArcade -- zero-setup Portainer stack.
#
# Nothing to create on the host. No mkdir, no chown, no LAN IP to look up.
# ROMs, saves and MAME config live in Docker-managed named volumes that the
# containers create and populate themselves on first boot.
#
# Deploy:  Stacks -> Add stack -> Repository
#   URL           https://github.com/jonfulk805-og/MyClover.Tech.CloverArcade
#   Reference     refs/heads/main
#   Compose path  docker-compose.portainer.yml
#
# The only setting worth touching is UPLOAD_TOKEN (below): set it to any long
# random string to switch on the ADD ROMS button, then add games from a browser.
# Leave it blank for a read-only arcade.
#
# Arcade:       http://<host>:8088
# MAME cabinet: http://<host>:8089
#
# Note: this file has no "profiles:" key, because Portainer's stack editor does
# not honour compose profiles. If you don't want the native MAME cabinet,
# delete the clovermame service before deploying.

services:
  cloverarcade:
    build: .
    image: myclovertech/cloverarcade:0.3.7
    container_name: cloverarcade
    ports:
      - "8088:80"
    volumes:
      - cloverarcade_roms:/roms
      - cloverarcade_saves:/saves
    environment:
      ARCADE_NAME: "CloverArcade"
      ARCADE_TAGLINE: "Insert Coin"
      ARCADE_THREADS: "4"
      ROM_RESCAN_SECONDS: "60"
      # "auto" = the MAME cabinet on this same host, port 8089, resolved against
      # whatever hostname your browser used. No host IP needed.
      MAME_CABINET_URL: "auto"
      # Blank = no write endpoint exists at all. Set a long random string to
      # enable in-browser ROM uploads.
      UPLOAD_TOKEN: ""
      UPLOAD_MAX_BYTES: "8589934592"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  clovermame:
    build: ./mame
    image: myclovertech/cloverarcade-mame:0.3.7
    container_name: clovermame
    ports:
      - "8089:3000"
      - "8443:3001"
    volumes:
      # Same ROM volume as the web arcade: anything uploaded to the arcade
      # folder is instantly visible to native MAME.
      - cloverarcade_roms:/roms:ro
      - clovermame_config:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "America/Los_Angeles"
      TITLE: "CloverArcade Cabinet"
      MAME_ROM_PATH: "/roms/arcade"
      MAME_GAME: ""
      MAME_EXTRA_ARGS: ""
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  cloverarcade_roms:
  cloverarcade_saves:
  clovermame_config:
