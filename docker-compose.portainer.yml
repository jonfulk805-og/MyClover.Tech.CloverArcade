# CloverArcade -- Portainer-friendly stack file.
#
# Differences from docker-compose.yml:
#   * no "profiles:" -- Portainer's stack editor does not honour compose profiles,
#     so the MAME cabinet is always deployed. Delete that service if you don't want it.
#   * absolute host paths -- relative "./roms" would land inside Portainer's own
#     stack directory, which is easy to lose track of. Uploaded ROMs live in
#     ${CLOVER_DATA} instead.
#   * ${VARIABLES} -- set these in Portainer's "Environment variables" box.
#
# Deploy: Stacks -> Add stack -> Repository
#   URL           https://github.com/jonfulk805-og/MyClover.Tech.CloverArcade
#   Reference     refs/heads/main
#   Compose path  docker-compose.portainer.yml
#
# On the Docker host, first:  sudo mkdir -p /opt/cloverarcade/roms/arcade /opt/cloverarcade/saves/mame
#                             sudo chown -R 1000:1000 /opt/cloverarcade

services:
  cloverarcade:
    build: .
    image: myclovertech/cloverarcade:0.3.0
    container_name: cloverarcade
    ports:
      - "8088:80"
    volumes:
      - ${CLOVER_DATA:-/opt/cloverarcade}/roms:/roms
      - ${CLOVER_DATA:-/opt/cloverarcade}/saves:/saves
    environment:
      ARCADE_NAME: "CloverArcade"
      ARCADE_TAGLINE: "Insert Coin"
      ARCADE_THREADS: "4"
      ROM_RESCAN_SECONDS: "60"
      # Use the Docker host's LAN IP here, not localhost -- you are browsing
      # from another machine, so "localhost" would mean your own laptop.
      MAME_CABINET_URL: "http://${CLOVER_HOST:-localhost}:8089"
      # Blank = read-only arcade. Set a long random string to enable uploads.
      UPLOAD_TOKEN: "${UPLOAD_TOKEN:-}"
      UPLOAD_MAX_BYTES: "8589934592"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  clovermame:
    build: ./mame
    image: myclovertech/cloverarcade-mame:0.3.0
    container_name: clovermame
    ports:
      - "8089:3000"
      - "8443:3001"
    volumes:
      - ${CLOVER_DATA:-/opt/cloverarcade}/roms/arcade:/roms/arcade:ro
      - ${CLOVER_DATA:-/opt/cloverarcade}/saves/mame:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-America/Los_Angeles}"
      TITLE: "CloverArcade Cabinet"
      MAME_ROM_PATH: "/roms/arcade"
      MAME_GAME: ""
      MAME_EXTRA_ARGS: ""
    shm_size: "1gb"
    restart: unless-stopped
